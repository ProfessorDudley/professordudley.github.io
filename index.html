<section>
  <h1>Blank canvas</h1>
  <p>Clean slate for the redesign. Use the floating menu to tune the background.</p>
</section>

<aside id="design-menu" aria-label="Design controls">
  <h2>Background</h2>
  <p id="bg-value">hsl(220 20% 12%)</p>
  <label>H <input id="bg-h" type="range" min="0" max="360" step="1" value="220"> <output id="bg-h-val">220</output></label>
  <label>S <input id="bg-s" type="range" min="0" max="100" step="1" value="20"> <output id="bg-s-val">20%</output></label>
  <label>L <input id="bg-l" type="range" min="0" max="100" step="1" value="12"> <output id="bg-l-val">12%</output></label>
  <div class="row">
    <button id="bg-copy" type="button">Copy CSS</button>
    <button id="bg-download" type="button">Save JSON</button>
    <button id="bg-reset" type="button">Reset</button>
  </div>
  <pre id="bg-css"></pre>
</aside>
